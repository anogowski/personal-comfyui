[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-custom-nodes-comfyui"
version = "0.1.0"
description = "Personal ComfyUI Nodes created by GitHub Copilot. ComfyUI image-processing and dynamic image-list custom nodes."
requires-python = ">=3.10"
dependencies = [
	"numpy",
	"Pillow>=9.1",
]

[tool.setuptools]
packages = ["personal-custom-nodes"]
package-dir = { "_personal-custom-nodes" = "." }
